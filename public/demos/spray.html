<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spray Playground</title>
<style>
  html, body { margin: 0; height: 100%; background: #17102d; overflow: hidden; font-family: ui-monospace, Consolas, monospace; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
  .ui { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .sw { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .sw.on { border-color: #f5f3ef; }
  button.clear { background: #f5f3ef; color: #080711; border: 0; border-radius: 99px; padding: 7px 12px; font: inherit; font-weight: 700; cursor: pointer; }
  .hint { position: fixed; top: 12px; left: 12px; color: #a9a3bd; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="hint">Drag to spray — hold still for drips</div>
<canvas id="c"></canvas>
<div class="ui" id="ui"></div>
<script>
  const c = document.getElementById('c'), g = c.getContext('2d');
  const colors = ['#19FF32', '#9B5CFF', '#E8FF2A', '#FF3FA4', '#F5F3EF', '#2DE2E6'];
  let color = colors[0], down = false, x = 0, y = 0, still = 0;
  const drips = [];
  function size() {
    const d = window.devicePixelRatio || 1;
    const img = c.width ? g.getImageData(0, 0, c.width, c.height) : null;
    c.width = innerWidth * d; c.height = innerHeight * d; c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    g.setTransform(d, 0, 0, d, 0, 0);
    // brick wall
    g.fillStyle = '#17102d'; g.fillRect(0, 0, innerWidth, innerHeight);
    g.strokeStyle = 'rgba(245,243,239,.05)';
    for (let r = 0; r < innerHeight / 30; r++) for (let k = -1; k < innerWidth / 70; k++) g.strokeRect(k * 70 + (r % 2) * 35, r * 30, 70, 30);
    if (img) g.putImageData(img, 0, 0);
  }
  size(); addEventListener('resize', size);
  const ui = document.getElementById('ui');
  colors.forEach((col, i) => { const b = document.createElement('div'); b.className = 'sw' + (i ? '' : ' on'); b.style.background = col; b.onclick = () => { color = col; [...ui.children].forEach(n => n.classList?.remove('on')); b.classList.add('on'); }; ui.appendChild(b); });
  const clr = document.createElement('button'); clr.className = 'clear'; clr.textContent = 'CLEAR WALL'; clr.onclick = () => { c.width = 0; size(); drips.length = 0; }; ui.appendChild(clr);
  c.addEventListener('pointerdown', e => { down = true; x = e.clientX; y = e.clientY; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => { if (down) { const dx = e.clientX - x, dy = e.clientY - y; if (dx * dx + dy * dy > 4) still = 0; x = e.clientX; y = e.clientY; } });
  addEventListener('pointerup', () => down = false);
  function spray() {
    g.fillStyle = color;
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, r = Math.pow(Math.random(), 1.8) * 26;
      g.globalAlpha = 0.25 + Math.random() * 0.5;
      g.beginPath(); g.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, Math.random() * 1.6 + .3, 0, 7); g.fill();
    }
    g.globalAlpha = 1;
  }
  (function loop() {
    if (down) { spray(); still++; if (still > 18 && Math.random() < .2) drips.push({ x: x + (Math.random() - .5) * 16, y, v: 0.6 + Math.random(), life: 60 + Math.random() * 120, w: 2 + Math.random() * 2.5, col: color }); }
    for (let i = drips.length - 1; i >= 0; i--) { const d = drips[i]; g.fillStyle = d.col; g.fillRect(d.x, d.y, d.w, d.v + 1); d.y += d.v; d.v *= .995; if (--d.life <= 0) { g.beginPath(); g.arc(d.x + d.w / 2, d.y, d.w * .9, 0, 7); g.fill(); drips.splice(i, 1); } }
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
